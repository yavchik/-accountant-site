<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сторінка не пройшла звірку — Happy Finance</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#102662">
  <!-- Сторінка «404». GitHub Pages і Vercel показують її самі для будь-якої неіснуючої адреси,
       тому все потрібне (стилі, шрифти) — всередині файлу, без відносних шляхів. -->
  <style>
    :root {
      --navy: #102662;
      --navy-900: #0b1c4c;
      --orange: #fb6835;
      --orange-700: #b9461a;
      --paper: #f5f4f0;
      --ink: #121420;
      --muted: #4a5170;
      --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    /* печатка «Не зійшлося» повернута й виступає за чек: без цього на телефоні сторінку можна тягнути вбік */
    html, body { overflow-x: clip; }
    body {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 48px 16px;
      background: radial-gradient(120% 90% at 50% 0%, #132c70 0%, var(--navy) 45%, var(--navy-900) 100%);
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .logo {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.02em;
      font-size: 1.125rem;
      text-decoration: none;
    }
    .logo span { color: var(--orange); }

    /* Чек */
    .rcpt {
      position: relative;
      width: min(420px, 100%);
      background: var(--paper);
      padding: 36px 32px 44px;
      box-shadow: 0 40px 80px -30px rgb(0 0 0 / 0.55);
      animation: print 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
      transform-origin: top;
    }
    .rcpt::after {             /* зубчастий край чека */
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -12px;
      height: 12px;
      background:
        linear-gradient(-45deg, transparent 8px, var(--paper) 0) 0 0 / 16px 12px repeat-x,
        linear-gradient(45deg, transparent 8px, var(--paper) 0) 0 0 / 16px 12px repeat-x;
    }
    @keyframes print {
      from { clip-path: inset(0 0 100% 0); transform: translateY(-24px); }
      to { clip-path: inset(0 0 -20px 0); transform: none; }
    }

    .rcpt__head {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px dashed #b9b6ad;
    }
    .rcpt__code {
      font-family: var(--mono);
      font-weight: 500;
      font-size: clamp(4.5rem, 20vw, 6.5rem);
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--navy);
      margin: 24px 0 8px;
    }
    h1 {
      font-size: clamp(1.5rem, 5vw, 1.875rem);
      line-height: 1.15;
      letter-spacing: -0.015em;
      color: var(--navy);
      margin-bottom: 20px;
    }
    .rcpt__rows {
      list-style: none;
      font-family: var(--mono);
      font-size: 0.875rem;
      color: var(--ink);
      padding: 16px 0;
      border-top: 1px dashed #b9b6ad;
      border-bottom: 1px dashed #b9b6ad;
      display: grid;
      gap: 6px;
    }
    .rcpt__rows li { display: flex; gap: 8px; align-items: baseline; }
    .rcpt__rows li::after { content: none; }
    .rcpt__dots { flex: 1; border-bottom: 1px dotted #9a978f; transform: translateY(-4px); }
    .rcpt__rows .bad { color: var(--orange-700); font-weight: 500; }
    .rcpt__text { color: var(--muted); margin: 20px 0 24px; }

    .stamp {
      position: absolute;
      right: 22px;
      top: 92px;
      padding: 6px 12px;
      border: 3px solid var(--orange);
      border-radius: 6px;
      color: var(--orange);
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.8125rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transform: rotate(-12deg);
      opacity: 0.85;
      animation: stamp 420ms cubic-bezier(0.34, 1.56, 0.64, 1) 900ms both;
    }
    @keyframes stamp {
      from { opacity: 0; transform: rotate(-12deg) scale(2.2); }
      to { opacity: 0.85; transform: rotate(-12deg) scale(1); }
    }

    .actions { display: grid; gap: 10px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 52px;
      padding: 0 20px;
      border-radius: 4px;
      font: 600 1rem/1 var(--font);
      text-decoration: none;
      transition: transform 160ms, box-shadow 160ms, background-color 160ms;
    }
    .btn--main { background: var(--orange); color: var(--navy); }
    .btn--main:hover { box-shadow: 0 12px 30px -12px rgb(251 104 53 / 0.8); transform: translateY(-1px); }
    .btn--ghost { color: var(--navy); border: 1.5px solid rgb(16 38 98 / 0.25); }
    .btn--ghost:hover { border-color: var(--navy); }
    .btn:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      .rcpt, .stamp { animation: none; }
    }
  </style>
</head>
<body>
  <a class="logo" href="/" data-home>HAPPY FINANCE<span>.</span></a>

  <main class="rcpt">
    <p class="rcpt__head"><span>Звірка сторінок</span><span data-date></span></p>
    <p class="stamp" aria-hidden="true">Не зійшлося</p>
    <p class="rcpt__code" aria-hidden="true">404</p>
    <h1>Ця сторінка не пройшла звірку</h1>
    <ul class="rcpt__rows">
      <li><span>Запит</span><span class="rcpt__dots"></span><span data-path>1 сторінка</span></li>
      <li><span>Знайдено</span><span class="rcpt__dots"></span><span>0</span></li>
      <li><span>Розбіжність</span><span class="rcpt__dots"></span><span class="bad">1</span></li>
    </ul>
    <p class="rcpt__text">Можливо, посилання застаріло або в адресі описка. На головній усе зведено до копійки.</p>
    <div class="actions">
      <a class="btn btn--main" href="/" data-home>Повернутися до балансу →</a>
      <a class="btn btn--ghost" href="https://t.me/MariiaPanchenko_ua" target="_blank" rel="noopener">Написати в Telegram</a>
    </div>
  </main>

  <script>
    // На GitHub Pages сайт живе в /-accountant-site/, на Vercel — у корені.
    (() => {
      const base = location.pathname.startsWith("/-accountant-site/") ? "/-accountant-site/" : "/";
      document.querySelectorAll("[data-home]").forEach(a => a.setAttribute("href", base));
      // Фірмові шрифти: шлях до них залежить від адреси сайту, тому підключаємо їх тут, а не в CSS
      if (window.FontFace && document.fonts) {
        const CYR = "U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116";
        const LAT = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD";
        [["Onest", "onest-var-cyrillic", "400 800", CYR], ["Onest", "onest-var-latin", "400 800", LAT],
         ["IBM Plex Mono", "ibm-plex-mono-400-cyrillic", "400", CYR], ["IBM Plex Mono", "ibm-plex-mono-400-latin", "400", LAT],
         ["IBM Plex Mono", "ibm-plex-mono-500-cyrillic", "500", CYR], ["IBM Plex Mono", "ibm-plex-mono-500-latin", "500", LAT]
        ].forEach(([family, file, weight, range]) => {
          const face = new FontFace(family, "url(" + base + "assets/fonts/" + file + ".woff2) format('woff2')",
                                    { weight, unicodeRange: range, display: "swap" });
          document.fonts.add(face);
          face.load().catch(() => {});
        });
      }
      const d = new Date();
      document.querySelector("[data-date]").textContent =
        String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear();
      let p = location.pathname.replace(base, "/");
      try { p = decodeURIComponent(p); } catch (e) { /* зіпсована адреса: показуємо як є */ }
      if (p.length > 18) p = "…" + p.slice(-17);
      if (p && p !== "/") document.querySelector("[data-path]").textContent = p;
    })();
  </script>
</body>
</html>
